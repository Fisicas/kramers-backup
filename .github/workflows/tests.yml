name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest          # the engine and config are portable
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Lint (errors only)
        run: |
          python -m pip install --quiet ruff
          ruff check --select F,E9 kramers tests tools Kramers.pyw
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Build the package
        run: |
          python -m pip install --quiet build
          python -m build
